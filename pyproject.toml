[build-system]
# scikit-build-core runs CMake: the wheel carries the engine module _azure2 and the program AZURE2, built from this
# source (docs/upgrade/pyazr3.md section 2.9; docs/source/getting_started/installation.rst).
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyazr"
description = "Python interface to the AZURE2 R-matrix code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AZURE2 developers" }]
keywords = ["nuclear physics", "R-matrix", "AZURE2", "nuclear astrophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# What "import pyazr" needs: numpy (python -X importtime and sys.modules after the import: neither mpmath nor scipy
# is imported; no module of the package imports mpmath).
dependencies = [
    "numpy>=1.24",
]

# The version is read from pyazr/__init__.py (__version__) so it is stated in exactly one place.
dynamic = ["version"]

[project.urls]
Homepage = "https://azure.nd.edu/"
Documentation = "https://azure2dev.github.io/AZURE2/"
Source = "https://github.com/rdeboer1/AZURE2"

[project.optional-dependencies]
# What the worked examples in pyazr/examples/ need, beyond the core.
# matplotlib: the --plot options; emcee, iminuit, scipy: the recipes fit_emcee.py, fit_iminuit.py, fit_scipy.py.
examples = ["matplotlib", "emcee", "iminuit", "scipy>=1.7"]
# The web UI's server (python -m pyazr.ui project.azr); httpx for its tests and for scripts that use the API; scipy for
# its fit job scipy_lbfgsb (pyazr/ui/jobs.py).
web = ["fastapi", "uvicorn", "httpx", "scipy>=1.7"]
all = ["matplotlib", "emcee", "iminuit", "scipy>=1.7"]

[project.scripts]
# The command line (pyazr/cli.py; also python -m pyazr).  The program AZURE2 is installed beside it from the
# wheel's scripts (src/CMakeLists.txt, the SKBUILD install rule).
pyazr = "pyazr.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.16"
cmake.build-type = "Release"
# Only what the wheel carries is built: the module and the program (not the tests, not the Coulomb-table tool).
build.targets = ["_azure2", "AZURE2"]
# Only the install rules of the component "python" (api/src/CMakeLists.txt, src/CMakeLists.txt): the vendored
# Minuit2's own install rules put nothing into the wheel.
install.components = ["python"]
install.strip = true
# The package directory as it is: every file under pyazr/ is in the wheel (pyazr/datafiles.py lists the non-Python
# ones), except what wheel.exclude names (pyazr/datafiles.py, NOT_SHIPPED; consistency check 48 keeps the two
# equal).  wheel.exclude also applies to what CMake installs, so it cannot name the module: a module an in-tree
# build left in pyazr/ stops the wheel's configuration instead (api/src/CMakeLists.txt).
wheel.packages = ["pyazr"]
wheel.exclude = ["pyazr/CLAUDE.md", "pyazr/examples/**", "**/__pycache__/**"]
wheel.license-files = ["LICENSE", "stopping/data/srim/README.md", "pyazr/ui/static/vendor/plotly-LICENSE.txt"]
# The CMake option set of a wheel: no tests.  The sampler numcmc
# stays on: it is vendored and static (nothing to install or ship), and the module's SamplerLogProbability
# (api/src/pybind_evaluation.cpp) needs it.
cmake.define = { BUILD_TESTING = "OFF", USE_MCMC = "ON", USE_API = "ON" }

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "pyazr/__init__.py"
regex = '(?m)^__version__ = [\x27"](?P<value>[^\x27"]+)[\x27"]'

[tool.cibuildwheel]
# Linux and macOS (.github/workflows/wheels.yml); Windows is not built (docs/upgrade/pyazr3.md section 2.9).
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686"
build-verbosity = 1
# Two threads per build: the runners are small.
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2" }
# The installed wheel, outside the source tree: import, describe(), T1-T3 against stored numbers, the program on T1.
test-command = "python {project}/tests/pyazr/wheel_smoke.py {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# GSL's headers and libraries (AlmaLinux 8: gsl-devel is in the powertools repository); auditwheel copies libgsl
# and libgomp into the wheel.
before-all = "dnf install -y dnf-plugins-core && dnf config-manager --set-enabled powertools && dnf install -y gsl-devel"
# The test command runs in the build's container: with this variable it writes each failed check as an annotation
# of the run (tests/pyazr/wheel_smoke.py), which can be read without a login.
environment-pass = ["GITHUB_ACTIONS"]

[tool.cibuildwheel.macos]
# Apple's clang has no OpenMP runtime: Homebrew's libomp (found by the top CMakeLists.txt); delocate copies libgsl
# and libomp into the wheel.  MACOSX_DEPLOYMENT_TARGET is set per runner by the workflow (that of the bottles).
before-all = "brew install gsl libomp"

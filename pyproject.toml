[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyazr"
description = "Python interface to the AZURE2 R-matrix code"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AZURE2 developers" }]
keywords = ["nuclear physics", "R-matrix", "AZURE2", "nuclear astrophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]

# mpmath is imported at module load by pyazr.transform, and scipy is needed by
# the width transformation (hyperu, CubicSpline); without both declared, a
# pip-installed pyazr fails on "import pyazr". The samplers and plotting
# libraries the examples use stay optional -- see optional-dependencies.
dependencies = [
    "numpy>=1.20",
    "mpmath>=1.2",
    "scipy>=1.7",
]

# The version is read from pyazr/__init__.py so it is stated in exactly one
# place; bumping it there is enough.
dynamic = ["version"]

[project.urls]
Homepage = "https://azure.nd.edu/"
Documentation = "https://rdeboer1.github.io/AZURE2/"
Source = "https://github.com/rdeboer1/AZURE2"

[project.optional-dependencies]
# What the worked examples in pyazr/examples/ need, beyond the core.
examples = ["matplotlib", "emcee", "multiprocess"]
zeus = ["zeus-mcmc"]
all = ["matplotlib", "emcee", "multiprocess", "zeus-mcmc"]

[project.scripts]
# The socket-based API is gone: pyazr talks to the engine in-process through
# the _azure2 pybind11 module (built by CMake with USE_API=ON), so there is
# nothing to launch and nothing to reap.

[tool.setuptools]
# pyazr is a plain package in the repository root; AZURE2 itself is C++ and is
# not installed by pip. The in-process engine is the pybind11 extension module
# _azure2.<platform>.so, built by CMake into the pyazr/ directory; ship it as
# package data so a pip install keeps working.
packages = ["pyazr"]

[tool.setuptools.package-data]
pyazr = ["_azure2*.so", "_azure2*.dylib", "_azure2*.pyd"]

[tool.setuptools.dynamic]
version = { attr = "pyazr.__version__" }

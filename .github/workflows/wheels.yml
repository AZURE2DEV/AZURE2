name: wheels

# Builds and tests the pyazr wheels (pyproject.toml: scikit-build-core, [tool.cibuildwheel]) and keeps them as the
# run's artifacts.  It publishes nothing: no upload to PyPI, no release, no secret.  Started by hand, on pull
# requests that change the packaging, and on a push to feature/upgrade that changes it.  The push trigger is there
# because GitHub offers "Run workflow" only for a workflow file of the default branch (main), which has none, so on
# this branch the workflow could not be started at all until 2026-11-16.  Remove it once the file is on main.
on:
  workflow_dispatch:
  push:
    branches: [feature/upgrade]
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - api/src/CMakeLists.txt
      - src/CMakeLists.txt
      - pyazr/datafiles.py
      - pyazr/coulomb_table.py
      - pyazr/program.py
      - tests/pyazr/wheel_smoke.py
      - .github/workflows/wheels.yml
  pull_request:
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - api/src/CMakeLists.txt
      - src/CMakeLists.txt
      - pyazr/datafiles.py
      - pyazr/coulomb_table.py
      - pyazr/program.py
      - tests/pyazr/wheel_smoke.py
      - .github/workflows/wheels.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Windows is the job below (wheels-windows): cibuildwheel compiles with MSVC and the engine is built with
      # MinGW (build.yml), so the Windows wheel is built by hand with the MinGW toolchain of build.yml's Windows job.
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          # The deployment target is the macOS of the runner, that of Homebrew's gsl and libomp bottles, which
          # delocate copies into the wheel.
          # macos-15, not macos-14: the first run (2026-11-16) was refused with "The configuration
          # 'macos-14-arm64-us-default' is not supported".  Whether macos-15 is accepted was not known when this was
          # written; if it is refused too, no arm64 macOS runner is open to this repository.
          - name: macos-arm64
            os: macos-15
            macos_target: '15.0'
          - name: macos-x86_64
            os: macos-15-intel
            macos_target: '15.0'
    steps:
      - uses: actions/checkout@v4

      # Builds every CPython of [tool.cibuildwheel] build: GSL before the build (before-all), the wheel with pip
      # and scikit-build-core, the repair (auditwheel on Linux, delocate on macOS: libgsl and the OpenMP runtime
      # copied into the wheel), then the test command (tests/pyazr/wheel_smoke.py) on the installed wheel.
      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v2.23.3
        with:
          output-dir: wheelhouse
        env:
          CIBW_ENVIRONMENT_MACOS: CMAKE_BUILD_PARALLEL_LEVEL=2 MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}

      - name: The wheels' files
        run: |
          for w in wheelhouse/*.whl; do
            echo "== $w ($(wc -c < "$w") bytes)"
            python3 -m zipfile -l "$w"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          retention-days: 14

  # The Windows wheel, built with the MinGW (MSYS2 UCRT64) toolchain that the Windows job of build.yml builds the
  # program with (the owner's answer of 2026-11-18: "MinGW, as the Windows program is built now").  The interpreter
  # is the python.org CPython of actions/setup-python, the one a user's pip installs the wheel into; only the
  # compiler, CMake, Ninja and GSL come from MSYS2.  NOT RUN YET: written without a Windows machine, the first run
  # of this job is its test (docs/upgrade/HANDOFF.md).  What to look at first: whether MinGW's linker accepts
  # python.org's import library python3XX.lib, whether delvewheel finds libgsl, libgomp and the MinGW run time in
  # MSYS2's /ucrt64/bin, and the program's own start (the last step; pyazr/program.py runs it with pyazr.libs on
  # its PATH).
  wheels-windows:
    name: windows-x86_64-cp${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The CPython versions of [tool.cibuildwheel] build.
        python: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      # The runner's Git writes CRLF at checkout; the test projects are read byte for byte (as in build.yml).
      - name: Check out with the committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The same packages as build.yml's Windows job, less Python (python.org's is used) and readline (gone).
      # libgomp is a package of its own in MSYS2 (gcc alone links no -fopenmp program: "cannot find -lgomp", the
      # first runs of this job); build.yml's job had it only as a dependency of scipy.
      - name: Set up MSYS2 (MinGW)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gsl

      # python.org's interpreter as a Windows path, for the MSYS2 shell below (where the PATH holds MSYS2 only), and
      # the build tools of the wheel (the build env of pip installs scikit-build-core and pybind11 itself).
      - name: The interpreter and the repair tool
        run: |
          PY="$(cygpath -m "$(command -v python)")"
          "$PY" -c 'import sys, struct; print(sys.executable, sys.version, struct.calcsize("P") * 8, "bit")'
          "$PY" -m pip install --quiet --upgrade pip wheel delvewheel
          echo "PYAZR_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "UCRT_BIN=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')/ucrt64/bin" >> "$GITHUB_ENV"

      # pip runs scikit-build-core, which runs the MSYS2 CMake with the Ninja generator and GCC (it would pick
      # Visual Studio otherwise).  Two build threads: the runners are small.
      - name: Build the wheel (MinGW)
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja
          CC: gcc
          CXX: g++
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -o pipefail
          "$PYAZR_PYTHON" -m pip wheel . --no-deps -w wheelhouse-raw -v --config-settings=build-dir=build-wheel 2>&1 | tee wheel-build.log
          ls -l wheelhouse-raw

      # The log of a failed build as annotations (readable without the job's log): its error lines and its end.
      - name: The failed build's error lines
        if: failure()
        shell: msys2 {0}
        run: |
          set +e +o pipefail
          [ -f wheel-build.log ] || { echo "::error::wheel-build.log was not written: the build step did not start pip"; exit 0; }
          note() { echo "::error title=$1::$(cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          { grep -n -i -E 'error|undefined reference|cannot find|not found|No such file' wheel-build.log | head -25; echo ...; tail -15 wheel-build.log; } | note "wheel build (MinGW): error lines"
          head -70 wheel-build.log | note "wheel build (MinGW): the log's first lines"
          { command -v gcc g++ cmake ninja; gcc --version | head -1; cmake --version | head -1; } 2>&1 | note "wheel build (MinGW): tools of the MSYS2 shell"
          log="$(ls build-wheel/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null | head -1)"
          if [ -n "$log" ]; then
            # The first failed OpenMP try-compile whole (its link line and the linker's words), long lines folded.
            awk '/OpenMP_COMPILE_RESULT_C_fopenmp/ {on=1} on {print} on && /^  -$/ {exit}' "$log" | fold -w 390 | grep -n -i -E 'ld\.exe|cannot|undefined|error|FAILED|collect2|-lgomp|\.spec|exitCode' | head -60 | note "wheel build (MinGW): the linker's lines of the OpenMP test"
            awk '/OpenMP_COMPILE_RESULT_C_fopenmp/ {on=1} on {print} on && /^  -$/ {exit}' "$log" | fold -w 390 | tail -45 | note "wheel build (MinGW): the end of the OpenMP test"
          else
            find build-wheel -maxdepth 2 2>/dev/null | head -40 | note "wheel build (MinGW): no CMakeConfigureLog; build-wheel holds"
          fi

      # delvewheel copies the DLLs of the module (GSL, the OpenMP runtime, the MinGW runtime) into pyazr.libs and
      # points the module at them.  --no-mangle-all keeps their names: the program pyazr/bin/AZURE2.exe, which
      # delvewheel does not patch, loads the same DLLs by their own names, from the PATH pyazr/program.py gives it.
      - name: Repair the wheel (delvewheel)
        run: |
          "$PYAZR_PYTHON" -m delvewheel repair --add-path "$UCRT_BIN" --no-mangle-all -w wheelhouse wheelhouse-raw/*.whl
          ls -l wheelhouse

      # The installed wheel, outside the source tree, in a fresh virtual environment: the same test as the other
      # platforms (pyproject.toml, [tool.cibuildwheel] test-command).
      - name: Test the wheel
        run: |
          "$PYAZR_PYTHON" -m venv "$RUNNER_TEMP/wheel-venv"
          VPY="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          "$VPY" -m pip install --quiet wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          "$VPY" "$GITHUB_WORKSPACE/tests/pyazr/wheel_smoke.py" "$GITHUB_WORKSPACE"

      - name: The wheels' files
        run: |
          for w in wheelhouse/*.whl; do
            echo "== $w ($(wc -c < "$w") bytes)"
            python -m zipfile -l "$w"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-cp${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 14

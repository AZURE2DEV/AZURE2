name: build

# Every push and pull request, so a platform breaking is visible immediately
# rather than at release time. Tags additionally publish a draft release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run at a time per branch. A push while a run is in progress queues a
# new run behind it instead of cancelling it (a full run takes ~40 min on the
# macOS leg, and a busy afternoon of pushes once left no run finished at all).
# GitHub keeps at most one queued run per group: a further push while one is
# already waiting replaces the waiting one, so only the newest commit waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Never cancel the other platforms when one fails: the point of the matrix
    # is to see every platform's errors in one run.
    strategy:
      fail-fast: false
      # pyazr_engine: pybind11, numpy and scipy are installed, so the _azure2
      # module is built and the pyazr tests that drive the engine must run.
      # One of them reported Skipped fails the job (see Unit tests); 'OFF'
      # would turn that into a warning, for a platform that cannot have them.
      matrix:
        include:
          - name: linux
            # Pinned to the oldest supported LTS rather than ubuntu-latest, for
            # the AppImage's sake.  A glibc-linked binary runs on the version it
            # was built against or newer, never older, so building on 24.04
            # (glibc 2.39) produced an AppImage that refused to start on Ubuntu
            # 22.04, Debian 12 and RHEL 9 -- the older LTS releases university
            # machines actually run -- with "GLIBC_2.38 not found", which reads
            # like a broken download rather than a distro floor.  22.04 carries
            # glibc 2.35 and covers those; the build is otherwise identical.
            os: ubuntu-22.04
            use_readline: 'ON'
            pyazr_engine: 'ON'
          - name: macos
            # Intel runner, kept from the Qt builds (Homebrew's qt@5 bottles
            # were x86_64 only); without Qt an arm64 runner is possible but
            # untested. macos-15-intel is a standard runner, free on public
            # repositories. (macos-13 was
            # retired, and a label with no runners behind it queues forever
            # rather than failing.)
            os: macos-15-intel
            use_readline: 'ON'
            pyazr_engine: 'ON'
          - name: windows
            os: windows-latest
            use_readline: 'ON'
            pyazr_engine: 'ON'

    defaults:
      run:
        shell: ${{ matrix.name == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      # The Windows runner's Git writes every text file with CRLF at checkout
      # (core.autocrlf true).  Tests of this branch compare committed files
      # byte for byte (the schema, the converted fixtures), so the tree is
      # checked out as committed.  This says nothing about a user's files: a
      # project and its data files in CRLF give identical output.
      - name: Check out with the committed line endings (windows)
        if: matrix.name == 'windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The unit-test step ends itself before the job's six hours run out (see there); it needs the job's start.
      - name: Note the job's start
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- linux
      - name: Install dependencies (linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgsl-dev libreadline-dev \
            python3-dev python3-venv
          # pybind11, numpy and scipy from pip in a venv rather than apt: the
          # image's packages (pybind11 2.9, numpy 1.21) are older than what
          # pyazr is developed against.  The venv's interpreter is the one
          # _azure2 is built for and the pyazr tests run under.
          python3 -m venv "$RUNNER_TEMP/pyazr-venv"
          PY="$RUNNER_TEMP/pyazr-venv/bin/python"
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet pybind11 numpy scipy mpmath
          # the web page's tests (tests/pyazr/ui): without these four they are skipped
          "$PY" -m pip install --quiet pytest fastapi httpx uvicorn
          # the page's fit and sampler jobs (iminuit, emcee) and the figures of two skills' self-tests (matplotlib):
          # without them tests/pyazr/ui/{jobs,sampler_bands,node}_test.py and those two self-tests fail
          "$PY" -m pip install --quiet iminuit emcee matplotlib
          "$PY" -c 'import numpy, scipy, mpmath, pybind11; print("numpy", numpy.__version__, "scipy", scipy.__version__, "pybind11", pybind11.__version__)'
          echo "PYAZR_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "PYBIND11_DIR=$("$PY" -m pybind11 --cmakedir)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- macos
      # Apple clang also ships no OpenMP runtime, so FindOpenMP fails outright
      # without libomp; the flags for it are passed at configure time, since
      # CMake cannot infer them for AppleClang.
      - name: Install dependencies (macos)
        if: matrix.name == 'macos'
        run: |
          brew install ninja gsl readline libomp
          # GNU tools for the two test steps only.  The test scripts added by the upgrade were written and run
          # against GNU tools and fail with the BSD ones of macOS (sed -i FILE, "\n" in a sed replacement, the
          # padded output of wc, a newline in an awk -v value) or without timeout (tools/run_one.sh; the shell
          # watchdog of tests/lib/guard.sh cannot follow "env VAR=..."): read from the first macOS run of these
          # tests.  The build keeps Apple's tools.
          brew install coreutils gnu-sed gawk grep findutils ||
            { echo "::error::macos: brew install coreutils gnu-sed gawk grep findutils failed"; exit 1; }
          GNUBIN=""
          for f in coreutils gnu-sed gawk grep findutils; do
            d="$(brew --prefix "$f")/libexec/gnubin"
            if [ -d "$d" ]; then GNUBIN="$GNUBIN${GNUBIN:+:}$d"; else echo "::warning::macos: no directory $d"; fi
          done
          echo "GNUBIN=$GNUBIN" >> "$GITHUB_ENV"
          # pybind11, numpy and scipy from pip in a venv: one interpreter that
          # _azure2 is built for and the pyazr tests run under, independent of
          # which python@3.x keg Homebrew's own numpy happens to use.
          python3 -m venv "$RUNNER_TEMP/pyazr-venv" ||
            { echo "::error::macos: could not create the pyazr venv with $(command -v python3)"; exit 1; }
          PY="$RUNNER_TEMP/pyazr-venv/bin/python"
          "$PY" -m pip install --quiet --upgrade pip
          "$PY" -m pip install --quiet pybind11 numpy scipy mpmath ||
            { echo "::error::macos: pip install pybind11 numpy scipy failed"; exit 1; }
          # the web page's tests (tests/pyazr/ui): without these four they are skipped
          "$PY" -m pip install --quiet pytest fastapi httpx uvicorn ||
            { echo "::error::macos: pip install pytest fastapi httpx uvicorn failed"; exit 1; }
          # the page's fit and sampler jobs and the figures of two skills' self-tests (as on linux)
          "$PY" -m pip install --quiet iminuit emcee matplotlib ||
            { echo "::error::macos: pip install iminuit emcee matplotlib failed"; exit 1; }
          "$PY" -c 'import sys, numpy, scipy, mpmath, pybind11; print(sys.executable, "numpy", numpy.__version__, "scipy", scipy.__version__, "pybind11", pybind11.__version__)'
          echo "PYAZR_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "PYBIND11_DIR=$("$PY" -m pybind11 --cmakedir)" >> "$GITHUB_ENV"
          echo "LIBOMP=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      # -------------------------------------------------------------- windows
      # MSYS2/mingw-w64 rather than MSVC: the project already targets mingw (see
      # docker/Dockerfile.windows and CROSS_COMPILE_WINDOWS), and the same
      # package set exists natively here.
      - name: Set up MSYS2 (windows)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gsl
            mingw-w64-ucrt-x86_64-readline
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-scipy
            mingw-w64-ucrt-x86_64-python-mpmath
            mingw-w64-ucrt-x86_64-pybind11
            diffutils

      # The UCRT64 Python, the one pacman installed numpy and scipy into, as a
      # Windows path: CMake is a native mingw program and cannot read /ucrt64.
      - name: Python for pyazr (windows)
        if: matrix.name == 'windows'
        run: |
          PY="$(cygpath -m "$(command -v python3)")"
          "$PY" -c 'import sys, numpy, scipy; print(sys.executable, "numpy", numpy.__version__, "scipy", scipy.__version__)'
          echo "PYAZR_PYTHON=$PY" >> "$GITHUB_ENV"

      # --------------------------------------------------------------- build
      - name: Configure
        run: |
          trap 'echo "::error::${{ matrix.name }} configure: failed at: $BASH_COMMAND"' ERR
          # An array, so the spaces inside the OpenMP flags survive intact.
          EXTRA=()
          if [ "${{ matrix.name }}" = "macos" ]; then
            # FindOpenMP cannot infer any of this for AppleClang: the compiler
            # needs -Xpreprocessor -fopenmp and the runtime lives in Homebrew's
            # libomp rather than beside the compiler.
            EXTRA+=(-DOpenMP_ROOT="$LIBOMP")
            EXTRA+=(-DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I$LIBOMP/include")
            EXTRA+=(-DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$LIBOMP/include")
            EXTRA+=(-DOpenMP_C_LIB_NAMES=omp)
            EXTRA+=(-DOpenMP_CXX_LIB_NAMES=omp)
            EXTRA+=(-DOpenMP_omp_LIBRARY="$LIBOMP/lib/libomp.dylib")
          fi
          # One interpreter for everything Python: pybind11 builds _azure2
          # against Python_EXECUTABLE (FindPython, which PYBIND11_FINDPYTHON
          # selects over FindPythonInterp, removed by CMake 3.27's CMP0148), and
          # tests/pyazr runs the tests with Python3_EXECUTABLE.  Two different
          # interpreters would build a module the tests cannot import -- which
          # they would report as Skipped.
          EXTRA+=(-DPYBIND11_FINDPYTHON=ON)
          EXTRA+=(-DPython_EXECUTABLE="$PYAZR_PYTHON")
          EXTRA+=(-DPython3_EXECUTABLE="$PYAZR_PYTHON")
          EXTRA+=(-DPYTHON_EXECUTABLE="$PYAZR_PYTHON")
          if [ -n "${PYBIND11_DIR:-}" ]; then EXTRA+=(-Dpybind11_DIR="$PYBIND11_DIR"); fi
          # A failure's first lines as an annotation: the log itself needs a
          # login, the annotations are public with the run.
          set -o pipefail
          if ! cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_API=ON \
            -DUSE_MCMC=ON \
            -DUSE_READLINE=${{ matrix.use_readline }} \
            "${EXTRA[@]}" 2>&1 | tee configure.log; then
            bash scripts/ci_first_errors.sh configure.log "${{ matrix.name }} configure"
            exit 1
          fi

      - name: Build
        id: build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2>&1 | tee build.log; then
            bash scripts/ci_first_errors.sh build.log "${{ matrix.name }} build"
            exit 1
          fi

      # Catches link errors and libraries the binary cannot resolve at runtime.
      # --help exits 0 and needs no display, so it works on a headless runner.
      - name: Smoke test
        run: |
          set -e
          BIN=build/src/AZURE2
          [ -x "$BIN" ] || BIN=build/src/AZURE2.exe
          "$BIN" --help > help.txt
          test -s help.txt
          grep -q "Syntax: AZURE2" help.txt
          echo "smoke test passed"

      # The smoke test only proves the binary starts. This runs the evaluations
      # in tests/ and compares chi-squared against recorded references, so a
      # change that still builds but moves the physics fails here -- on every
      # platform, which is also how cross-platform numerical drift shows up.
      # The script prints the offending chi-squared and segment counts, but a
      # failure only reaches the run summary as "exit code 1" -- and the job log
      # itself needs a token to read, which the person debugging may not have.
      # Echoing the salient lines as ::error:: puts them in the run's
      # annotations, which are public.
      - name: Physics regression tests
        run: |
          set -o pipefail
          # The check.sh scripts call python3: the interpreter of the pyazr venv, which has numpy and mpmath (the
          # runner's own python3 has neither), comes first on PATH.
          if [ -n "${PYAZR_PYTHON:-}" ] && [ "${{ matrix.name }}" != "windows" ]; then
            export PATH="$(dirname "$PYAZR_PYTHON"):$PATH"
          fi
          # macOS: the GNU tools of the install step before Apple's (see there)
          if [ "${{ matrix.name }}" = "macos" ] && [ -n "${GNUBIN:-}" ]; then export PATH="$GNUBIN:$PATH"; fi
          # Windows: the test scripts make their work directories under TMPDIR and hand the paths to native programs
          # (python, AZURE2) inside files and variables, where MSYS does not translate /tmp: a Windows path instead.
          if [ "${{ matrix.name }}" = "windows" ]; then export TMPDIR="$(cygpath -m "$RUNNER_TEMP")"; fi
          if ! ./tests/run_tests.sh 2>&1 | tee physics-tests.log; then
            # Every failing test by name in the first annotation: GitHub shows ten annotations per step, and the
            # ones below stop at ten.
            BAD="$(awk '/^=== / { if (bad) print head; head = $0; bad = 0; next }
                        /FAIL|ERROR|missing|No such|not found|Killed|Timeout|timed out/ && $0 !~ /^ *ok / { bad = 1 }
                        END { if (bad) print head }' physics-tests.log | sed 's/^=== //; s/ ===$//' | paste -sd ',' -)"
            echo "::error::physics regression tests failed on ${{ matrix.name }}: $(tail -1 physics-tests.log)%0A$BAD"
            # The first failing lines of every failing test in one annotation: the nine below hid four of thirteen
            # failing checks in the first Windows run that reached them.
            awk -v os="${{ matrix.name }}" '
              function flush() { if (bad) out = out "%0A" head why; head = ""; why = ""; nwhy = 0; bad = 0 }
              /^=== / { flush(); head = $0; next }
              head != "" && /FAIL|ERROR|missing|No such|not found|Killed|Timeout|timed out/ && $0 !~ /^ *ok / {
                bad = 1; gsub(/%/, "%25"); gsub(/\r/, ""); if (++nwhy <= 4) why = why "%0A    " substr($0, 1, 240) }
              END { flush(); if (out != "") printf "::error::%s: the first failing lines of every failing check:%s\n", os, out }
              ' physics-tests.log
            # One annotation per failing test (GitHub shows only ten per step),
            # carrying that test's own output, so the reason is readable without
            # downloading the log.  %0A is a newline inside an annotation.
            awk -v os="${{ matrix.name }}" '
              function flush() { if (bad && blk != "") printf "::error::%s: %s%s%%0A--%s\n", os, head, why, blk
                                 blk = ""; head = ""; why = ""; nwhy = 0; bad = 0 }
              /^=== / { flush(); head = $0; blk = " "; next }
              blk != "" { gsub(/%/, "%25"); gsub(/\r/, ""); blk = blk "%0A" $0
                          # the lines that say what failed come first: GitHub cuts a long annotation
                          if ($0 ~ /FAIL|ERROR|missing|No such|not found|Killed|Timeout|timed out/ && $0 !~ /^ *ok /) {
                            bad = 1; if (++nwhy <= 12) why = why "%0A" $0 } }
              END { flush() }' physics-tests.log | head -8
            exit 1
          fi

      # Everything the physics suite cannot see, because it drives the engine
      # and nothing else: reference tests against closed forms, the pyazr .azr
      # round trip and engine bindings, and the repository consistency checks.
      #
      # ctest counts a skipped test (exit 77, SKIP_RETURN_CODE) as no failure,
      # so its status alone cannot tell "the pyazr engine tests ran" from "the
      # _azure2 module or numpy went missing and every one of them skipped" --
      # which is how none of them had ever run in CI.  Every skipped test
      # is therefore listed in a warning annotation, and a skipped pyazr test
      # fails the job where matrix.pyazr_engine says it must run.
      # Runs even when the physics suite failed: otherwise one platform-specific
      # chi-squared failure hides every unit-test failure on that platform for
      # as long as it lasts (macOS, 2026-10-25 on).
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # The pyazr tests labelled slow (tests/pyazr/CMakeLists.txt) take 5-40 min
        # each; run them locally (ctest -L slow) when changing pyazr.
        # The test labelled browser (the page in a headless Chrome, minutes) is
        # run locally too (ctest -L browser): it has never run on a CI machine.
        run: |
          set -o pipefail
          rc=0
          if [ "${{ matrix.name }}" = "windows" ]; then export TMPDIR="$(cygpath -m "$RUNNER_TEMP")"; fi
          # macOS: the GNU tools of the install step before Apple's (see there)
          if [ "${{ matrix.name }}" = "macos" ] && [ -n "${GNUBIN:-}" ]; then export PATH="$GNUBIN:$PATH"; fi
          # Every test is bounded, and so is the step.  The macOS job of 0c6167c1 reached GitHub's six-hour limit
          # 3 h 20 min into this step and was cancelled: nothing of the step reached the annotations, so which test
          # hung or crawled was not known.  --timeout bounds each test that has no TIMEOUT of its own (the longest
          # unit test on Linux takes minutes); the step's own limit ends ctest 20 minutes before the job's, so the
          # annotations below are still written and name the tests that had started and not ended.
          TIMEOUT_CMD="$(command -v timeout || command -v gtimeout || true)"
          # GNU's only (Windows has a timeout.exe that waits for a key)
          if [ -n "$TIMEOUT_CMD" ]; then
            case "$("$TIMEOUT_CMD" --version 2>/dev/null || true)" in *GNU*) ;; *) TIMEOUT_CMD="" ;; esac
          fi
          LEFT=$(( ${JOB_START:-$(date +%s)} + 340 * 60 - $(date +%s) ))
          [ "$LEFT" -ge 600 ] || LEFT=600
          echo "unit tests: at most $((LEFT / 60)) min for the step, 40 min for a test without its own TIMEOUT"
          LIMIT=()
          [ -z "$TIMEOUT_CMD" ] || LIMIT=("$TIMEOUT_CMD" -k 60 "$LEFT")
          # Two tests at a time.  One at a time the step took 98 min on Linux, 81 on Windows and more than the 181
          # the job had left on macOS (run 44165462036 of 7b804180: stopped with 329 of 389 tests ended, none
          # failed).  The runners have 4 cores (macos-15-intel, ubuntu-22.04, windows-latest); the tests set
          # OMP_NUM_THREADS=2 and declare PROCESSORS where they need more, which ctest counts against -j.
          "${LIMIT[@]}" ctest --test-dir build --output-on-failure --timeout 2400 -j 2 -LE "slow|browser" 2>&1 \
            | tee unit-tests.log || rc=$?
          # The slowest tests, always (a notice): which tests take the time on each platform.
          awk '/^ *[0-9]+\/[0-9]+ Test +#[0-9]+: / { for (i = 1; i <= NF; i++) if ($i == "sec") print $(i - 1), $4 }' \
            unit-tests.log | sort -rn \
            | awk -v os="${{ matrix.name }}" 'NR <= 15 { s = s "%0A" $1 " s  " $2; t += $1 } END { if (NR) printf "::notice::%s: the 15 slowest unit tests (%d s together):%s\n", os, t, s }'
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            # ctest was stopped by the step's limit: the tests it had started and not ended
            HUNG="$(awk '/^ *Start +[0-9]+: / { sub(/^ *Start +/, ""); n = $0; sub(/:.*/, "", n); sub(/^[0-9]+: /, ""); s[n] = $0 }
                         /^ *[0-9]+\/[0-9]+ Test +#[0-9]+: / { n = $3; sub(/^#/, "", n); sub(/:$/, "", n); delete s[n] }
                         END { for (n in s) print s[n] }' unit-tests.log | paste -sd ' ' -)"
            echo "::error::${{ matrix.name }}: the unit tests were stopped after $((LEFT / 60)) min (the job's time limit); running then: ${HUNG:-none found}; $(grep -c ' Test  *#' unit-tests.log) test(s) had ended"
          fi
          # ctest's closing "The following tests did not run:" block, one
          # "<n> - <name> (Skipped)" line per test.
          SKIPPED="$(awk '/ - .* \(Skipped\)/ { sub(/^[ \t]*[0-9]+ - /, ""); sub(/ \(Skipped\).*$/, ""); print }' unit-tests.log)"
          if [ -n "$SKIPPED" ]; then
            echo "::warning::${{ matrix.name }}: $(echo "$SKIPPED" | wc -l | tr -d ' ') test(s) skipped:%0A$(echo "$SKIPPED" | paste -sd ' ' -)"
          fi
          if [ "$rc" -ne 0 ]; then
            # Every failed test by name in the first annotation (ctest's closing "The following tests FAILED:"
            # block): GitHub shows ten annotations per step, and the ones below stop at ten.
            BAD="$(awk 'f && /^[ \t]*[0-9]+ - / { sub(/^[ \t]*[0-9]+ - /, ""); sub(/ \(.*$/, ""); print }
                        /The following tests FAILED:/ { f = 1 }' unit-tests.log | paste -sd ' ' -)"
            echo "::error::unit tests failed on ${{ matrix.name }}: $(echo "$BAD" | wc -w | tr -d ' ') test(s):%0A$BAD"
            # The failed tests grouped by the last line of their output, in one annotation: one cause that fails
            # a hundred tests (the first Windows run: 130 on one missing call) is then one row, and the others show.
            awk -v os="${{ matrix.name }}" '
              function flush() { if (name != "") { if (!(last in cnt)) order[++m] = last
                                   if (++cnt[last] <= 5) who[last] = who[last] " " name } name = ""; last = "" }
              /^ *[0-9]+\/[0-9]+ Test +#[0-9]+: / { flush(); if ($0 ~ /Failed|Timeout|Exception|Not Run/) name = $4; next }
              /^[0-9]+% tests passed/ { flush() }
              name != "" && $0 !~ /^ *Start +[0-9]+: / && $0 !~ /^[ \t\r]*$/ {
                gsub(/%/, "%25"); gsub(/\r/, ""); last = substr($0, 1, 220) }
              END { flush()
                    for (i = 1; i <= m && i <= 40; i++) { k = order[i]
                      out = out "%0A" cnt[k] " test(s):" who[k] (cnt[k] > 5 ? " ..." : "") "%0A    " k }
                    if (out != "") printf "::error::%s: failed unit tests by the last line of their output:%s\n", os, out }
              ' unit-tests.log
            # The first failing lines of every failed test in one annotation: the last line of a test that prints
            # "FAILED: 1 check(s)" does not say which check (the second Windows run: eleven tests of 27 so).
            awk -v os="${{ matrix.name }}" '
              function flush() { if (name != "") out = out "%0A" name ":" (why == "" ? " (no failing line found)" : why)
                                 name = ""; why = ""; k = 0 }
              /^ *[0-9]+\/[0-9]+ Test +#[0-9]+: / { flush(); if ($0 ~ /Failed|Timeout|Exception|Not Run/) name = $4; next }
              /^[0-9]+% tests passed/ { flush() }
              name != "" && /FAIL|Error|error:|refused|differ/ && $0 !~ /^ *ok / && $0 !~ /^ *(FAIL|FAILED)[: ]*[0-9]* *(check|failure)/ {
                gsub(/%/, "%25"); gsub(/\r/, ""); if (++k <= 3) why = why "%0A    " substr($0, 1, 260) }
              END { flush(); if (out != "") printf "::error::%s: the first failing lines of every failed unit test:%s\n", os, out }
              ' unit-tests.log
            # One annotation per failed test with its failing lines and the tail of its own output
            # (%0A = newline), so the reason shows without the log download.
            awk -v os="${{ matrix.name }}" '
              function flush() { if (name != "") { n = split(buf, L, "\n"); s = (n > 25) ? n - 24 : 1; out = ""; why = ""; k = 0
                                   # the lines that say what failed come first, then the tail
                                   for (i = 1; i < s; i++) if (L[i] ~ /FAIL|Error|error:/ && ++k <= 10) why = why "%0A" L[i]
                                   for (i = s; i <= n; i++) out = out "%0A" L[i]
                                   printf "::error::%s: %s%s%s\n", os, name, why, out } name = ""; buf = "" }
              /^ *[0-9]+\/[0-9]+ Test +#[0-9]+: / { flush(); if ($0 ~ /Failed|Timeout|Exception|Not Run/) name = $0; next }
              name != "" { gsub(/%/, "%25"); gsub(/\r/, ""); buf = buf $0 "\n" }
              END { flush() }' unit-tests.log | head -8
            exit 1
          fi
          # The web page's tests need pytest, fastapi, httpx and uvicorn, which the Windows job does not install:
          # there they are skipped and listed in the warning above, and do not fail the job.
          MUST_RUN="$(echo "$SKIPPED" | grep '^pyazr_' || true)"
          # Windows also skips, by design, the two ENDF tests: pyazr_endf_covariance needs iminuit, which the job does
          # not install, and pyazr_endf_check runs shell stand-ins of the processing codes.
          if [ "${{ matrix.name }}" = "windows" ]; then MUST_RUN="$(echo "$MUST_RUN" | grep -v -e '^pyazr_ui_' -e '^pyazr_endf_covariance$' -e '^pyazr_endf_check$' || true)"; fi
          if [ "${{ matrix.pyazr_engine }}" = "ON" ] && [ -n "$MUST_RUN" ]; then
            # Why: the import every engine test starts with, run here so the
            # reason reaches the annotation rather than only the test's output.
            WHY="$( { "$PYAZR_PYTHON" -c 'import numpy, scipy, mpmath, pyazr._azure2' 2>&1 || true; } | tail -3 \
                   | awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%s", (NR > 1 ? "%0A" : ""), $0 }')"
            echo "::error::${{ matrix.name }}: pyazr engine tests skipped although pybind11, numpy and scipy were installed:%0A$(echo "$MUST_RUN" | paste -sd ' ' -)%0Amodule files: $(ls pyazr/_azure2* 2>/dev/null | paste -sd ' ' - || true)%0A${WHY:-the import succeeds here; see unit-tests.log}"
            exit 1
          fi

      # Keeps the whole picture -- every project's run.log and the chi-squared
      # it produced -- for a failure the annotations above do not explain.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.name }}
          path: |
            physics-tests.log
            tests/*/run.log
            tests/*/check.log
            tests/*/output/chiSquared.out
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------- package
      # The command-line program with the libraries it loads beside it.  This
      # line has no graphical front end (docs/upgrade/HANDOFF.md, decision 3).
      - name: Package (windows)
        if: matrix.name == 'windows'
        run: |
          mkdir -p dist
          cp build/src/AZURE2.exe dist/
          # The mingw runtime and the libraries the executable loads.
          ldd dist/AZURE2.exe | awk '/ucrt64/ {print $3}' | xargs -r -I{} cp -n {} dist/ || true

          echo "--- packaged ---"
          ls -R dist | head -60

      # The bare executable.  It loads GSL, readline and libomp from
      # Homebrew; a self-contained macOS package of the command-line program
      # is not designed yet (the Qt .app/.dmg was removed with the GUI).
      - name: Package (macos)
        if: matrix.name == 'macos'
        run: |
          set -e
          mkdir -p dist
          cp build/src/AZURE2 build/src/azure2-coulomb-table dist/
          tar -C dist -czf AZURE2-macos-x86_64.tar.gz AZURE2 azure2-coulomb-table
          mv AZURE2-macos-x86_64.tar.gz dist/
          ls -lh dist

      # A single self-contained file that runs on any reasonably current distro
      # without root, rather than a snap: strict confinement fights the
      # arbitrary data paths an .azr project points at. linuxdeploy copies the
      # libraries the executable loads.
      - name: Package (linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/128x128/apps

          cmake --install build --prefix AppDir/usr 2>/dev/null || \
            cp build/src/AZURE2 AppDir/usr/bin/
          [ -f AppDir/usr/bin/AZURE2 ] || cp build/src/AZURE2 AppDir/usr/bin/

          cp packaging/icons/azure2_icon.png \
            AppDir/usr/share/icons/hicolor/128x128/apps/azure2.png

          cat > AppDir/usr/share/applications/azure2.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=AZURE2
          Comment=R-Matrix Analysis Software
          Exec=AZURE2
          Icon=azure2
          Terminal=true
          Categories=Science;Physics;Education;
          Keywords=nuclear;physics;rmatrix;analysis;
          StartupWMClass=AZURE2
          DESKTOP

          BASE=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          RUNTIME=https://github.com/AppImage/type2-runtime/releases/download/continuous

          # These are fetched from GitHub releases on every run, so a bad minute
          # upstream fails the build with nothing wrong in the tree.  Retry
          # rather than take the first 5xx as final.
          fetch() { curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$1" "$2"; }

          fetch linuxdeploy "$BASE/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy

          # The appimage output plugin downloads this itself, unretried, at the
          # very end of packaging -- a 503 there discards a build that has
          # already compiled and passed its tests.  Fetch it up front and hand
          # it over instead.
          fetch runtime-x86_64 "$RUNTIME/runtime-x86_64"
          export LDAI_RUNTIME_FILE="$PWD/runtime-x86_64"

          # The runner has no FUSE, so the AppImage tools have to be unpacked
          # rather than executed directly.
          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/azure2.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/azure2.png

          mv AZURE2*.AppImage dist/ 2>/dev/null || mv ./*.AppImage dist/
          chmod +x dist/*.AppImage

          # Prove it actually runs, self-contained, before shipping it.
          ./dist/*.AppImage --appimage-extract-and-run --help > appimage-help.txt
          grep -q "Syntax: AZURE2" appimage-help.txt
          echo "AppImage smoke test passed"
          ls -lh dist/

      # Kept 7 days, not the repository's 90: every push on every branch
      # uploads all three platforms (33.5 GB live on 2026-11-05 at 90 days),
      # and nobody downloads a weeks-old per-push build. What users take lives
      # elsewhere and does not expire: the rolling pre-release below (each
      # platform from the newest dev commit that built on it) and the tagged
      # releases. The jobs below read these artifacts minutes after the
      # upload, within the same run.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZURE2-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The Windows, macOS and Linux builds of the newest dev commit, behind stable
  # download links, published as the "Pre-release Build".
  #
  # The matrix already uploads dist/ as a run artifact, but that is only
  # reachable by a signed-in GitHub user, from the run page, and it expires with
  # the run's retention. Users want a URL they can just click, so the same
  # packages are also published to a rolling pre-release whose tag is moved to
  # each new dev commit:
  #
  #   https://github.com/AZURE2DEV/AZURE2/releases/download/continuous-windows/AZURE2-windows-x86_64.zip
  #   https://github.com/AZURE2DEV/AZURE2/releases/download/continuous-windows/AZURE2-macos.dmg
  #   https://github.com/AZURE2DEV/AZURE2/releases/download/continuous-windows/AZURE2-x86_64.AppImage
  #
  # Linux was added when the run artifacts went to 7-day retention: before, the
  # AppImage existed only as an artifact, so a week without pushes would have
  # left Linux users with nothing to download.
  #
  # The tag keeps its original name, continuous-windows, although the release
  # now carries macOS and Linux too: the tag is part of every download URL, and those
  # links are already in the README and in students' hands.  Only the release
  # title says what it holds.
  #
  # It is a pre-release on purpose: it is whatever dev currently builds, not a
  # version anyone should cite. Tagged releases still go through the draft
  # release below, untouched by this.
  continuous-windows:
    name: Pre-release build
    # !cancelled() rather than plain success(): needs waits for the whole
    # matrix, so without it one platform's breakage -- Homebrew's qt@5 is
    # deprecated and will be disabled -- would stop every platform getting
    # builds.  Each platform is published when it packaged and otherwise keeps
    # its previous file; the job fails only if no platform packaged at all.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AZURE2-windows
          path: dist

      # Best effort, as for Windows: one platform's failure must not stop the
      # others, which is why this job runs on !cancelled() at all.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AZURE2-macos
          path: dist-macos

      # Best effort too, for the same reason.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AZURE2-linux
          path: dist-linux

      - name: Zip it
        run: |
          set -e
          # No archive at all rather than an empty one when Windows did not
          # package; the publish step then keeps the previous zip.
          if [ ! -f dist/AZURE2.exe ]; then
            echo "No Windows build in this run."
            exit 0
          fi
          {
            echo "AZURE2 for Windows (x86_64), built from dev@${GITHUB_SHA}"
            date -u +'%Y-%m-%d %H:%M UTC'
            echo
            echo "Unzip anywhere and run AZURE2.exe. The mingw libraries it"
            echo "needs are in the same folder, so nothing else has to be"
            echo "installed."
          } > dist/BUILD-INFO.txt
          cd dist && zip -r ../AZURE2-windows-x86_64.zip .

      # The tag has to move to the new commit, which is why this is not just an
      # asset upload: a release keeps whatever commit its tag pointed at when it
      # was created.
      - name: Publish the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=continuous-windows
          # Nothing packaged on any platform: fail visibly, and do not move
          # the tag to a commit none of the files was built from.
          if [ ! -f AZURE2-windows-x86_64.zip ] && ! ls dist-macos/*.dmg >/dev/null 2>&1 \
             && ! ls dist-linux/*.AppImage >/dev/null 2>&1; then
            echo "::error::no platform packaged in this run; pre-release not updated"
            exit 1
          fi
          git push -f origin "HEAD:refs/tags/$TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --title "Pre-release Build" \
              --notes "Rolling build of the latest dev commit, for Windows, macOS and Linux. Replaced on every push."
          fi
          # --clobber so the stable filename is overwritten rather than
          # accumulating AZURE2-windows-x86_64-1.zip and friends.
          UPDATED=""
          if [ -f AZURE2-windows-x86_64.zip ]; then
            gh release upload "$TAG" AZURE2-windows-x86_64.zip --clobber
            UPDATED="$UPDATED Windows"
          else
            echo "No Windows zip in this run; leaving the previous one in place."
          fi
          # The macOS disk image, when that platform packaged successfully.
          DMG=$(ls dist-macos/*.dmg 2>/dev/null | head -1 || true)
          if [ -n "$DMG" ]; then
            cp "$DMG" AZURE2-macos.dmg
            gh release upload "$TAG" AZURE2-macos.dmg --clobber
            UPDATED="$UPDATED macOS"
          else
            echo "No macOS disk image in this run; leaving the previous one in place."
          fi
          # The Linux AppImage, under a stable name, when Linux packaged
          # successfully.  Release assets keep no file mode, hence chmod +x in
          # the README.
          APPIMAGE=$(ls dist-linux/*.AppImage 2>/dev/null | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" AZURE2-x86_64.AppImage
            gh release upload "$TAG" AZURE2-x86_64.AppImage --clobber
            UPDATED="$UPDATED Linux"
          else
            echo "No Linux AppImage in this run; leaving the previous one in place."
          fi
          gh release edit "$TAG" \
            --prerelease \
            --title "Pre-release Build" \
            --notes "Rolling build of dev for Windows, macOS and Linux, replaced on every push to dev. The last push (\`${GITHUB_SHA:0:7}\`) updated:${UPDATED}; a platform not listed keeps its file from the last dev commit that built on it. Not a released version -- for a citable build use a tagged release."

  # Tags promote the same artifacts to a draft release, so nothing is published
  # without a human looking at it first.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per platform
        run: |
          cd artifacts
          for d in */; do zip -r "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*.zip

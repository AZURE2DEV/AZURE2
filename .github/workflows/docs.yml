name: docs

# The documentation is built on every push and pull request, so a broken
# cross-reference or an unbuildable page fails like any other regression.
# Only pushes to the published branches deploy.
on:
  push:
    branches: [qt5, dev]
  pull_request:
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway: a half-published site
# is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      # -W turns warnings into errors: a broken :doc: reference or a page
      # missing from a toctree is a defect, and silently shipping it defeats
      # the point of publishing.
      - name: Build the user guide
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

      # The C++ internals, published alongside at /api/.
      - name: Build the API reference
        run: |
          cd docs
          doxygen Doxyfile
          if [ ! -f api/html/index.html ]; then
            echo "Doxygen produced no HTML"
            exit 1
          fi

      - name: Assemble the site
        run: |
          mkdir -p docs/_build/html/api
          cp -r docs/api/html/* docs/_build/html/api/
          # Sphinx marks the tree with .nojekyll already; make sure of it, or
          # GitHub Pages will drop the _static and _sources directories.
          touch docs/_build/html/.nojekyll
          echo "pages: $(find docs/_build/html -name '*.html' | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Publishing happens from the default branch only. The github-pages
    # environment restricts deployments to qt5, so a push to dev builds the
    # documentation (catching breakage early) without attempting to publish it;
    # the site updates when the work reaches qt5. Allowing dev to publish as
    # well is a repository setting -- Settings, Environments, github-pages,
    # deployment branches -- and needs admin rights.
    if: github.event_name == 'push' && github.ref == 'refs/heads/qt5'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

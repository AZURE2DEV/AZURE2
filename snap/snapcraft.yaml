name: azure2
base: core22
version: '1.1.0'
summary: AZURE2 R-Matrix Analysis Software
description: |
  AZURE2 is a nuclear physics R-Matrix analysis software package used for 
  analyzing nuclear reaction data. It provides both command-line and 
  graphical interfaces for nuclear physics calculations and data fitting.
  
  This snap package includes all necessary dependencies and can run on
  any Linux distribution that supports snap packages.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  azure2:
    command: bin/AZURE2
    desktop: usr/share/applications/azure2.desktop
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - network
      - removable-media
    environment:
      # Qt environment
      QT_QPA_PLATFORMTHEME: gtk3
      QTWEBENGINE_DISABLE_SANDBOX: 1
      # Ensure Qt can find plugins
      QT_PLUGIN_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/qt5/plugins
      QT_QPA_PLATFORM_PLUGIN_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/qt5/plugins/platforms
      # GSL and math libraries
      GSL_RNG_TYPE: ranlxs2
      GSL_RNG_SEED: 1

  azure2-gui:
    command: bin/AZURE2
    desktop: usr/share/applications/azure2.desktop
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback
      - network
      - removable-media
    environment:
      QT_QPA_PLATFORMTHEME: gtk3
      QTWEBENGINE_DISABLE_SANDBOX: 1
      QT_PLUGIN_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/qt5/plugins
      QT_QPA_PLATFORM_PLUGIN_PATH: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/qt5/plugins/platforms

parts:
  azure2:
    plugin: cmake
    source: .
    source-type: local
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_GUI=ON
      - -DUSE_QWT=ON
      - -DUSE_API=ON
      - -DUSE_STAT=ON
      - -DUSE_READLINE=ON
      - -DCODE_COVERAGE=OFF
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - build-essential
      - cmake
      - pkg-config
      - libgsl-dev
      - libqt5-dev
      - qt5-qmake
      - libqt5svg5-dev
      - libqt5printsupport5
      - libqwt-qt5-dev
      - libreadline-dev
      - libncurses5-dev
      - libblas-dev
      - liblapack-dev
      - libgomp1
      - qtbase5-dev-tools
      - qttools5-dev-tools
    stage-packages:
      - libgsl27
      - libgslcblas0
      - libqt5core5a
      - libqt5gui5
      - libqt5widgets5
      - libqt5printsupport5
      - libqt5svg5
      - libqwt-qt5-6
      - libreadline8
      - libncurses6
      - libblas3
      - liblapack3
      - libgomp1
      - libstdc++6
      - libgcc-s1
      - libc6
      - qt5-gtk-platformtheme
      - qt5-style-plugins
      - libqt5dbus5
      - libfontconfig1
      - libfreetype6
      - libpng16-16
      - libx11-6
      - libxext6
      - libxrender1
      - libxrandr2
      - libxss1
      - libglib2.0-0
      - libgtk-3-0
      - libcairo-gobject2
      - libcairo2
      - libgdk-pixbuf-2.0-0
      - libpango-1.0-0
      - libharfbuzz0b
      - shared-mime-info
    override-build: |
      craftctl default
      
      # Create desktop file
      mkdir -p $CRAFTCTL_PART_INSTALL/usr/share/applications
      cat > $CRAFTCTL_PART_INSTALL/usr/share/applications/azure2.desktop << EOF
      [Desktop Entry]
      Version=1.0
      Type=Application
      Name=AZURE2
      Comment=R-Matrix Analysis Software
      Exec=azure2
      Icon=azure2
      Terminal=false
      Categories=Science;Physics;Education;
      Keywords=nuclear;physics;rmatrix;analysis;
      StartupWMClass=AZURE2
      EOF
      
      # Create icon if available
      if [ -f gui/images/azure2_icon.png ]; then
        mkdir -p $CRAFTCTL_PART_INSTALL/usr/share/icons/hicolor/128x128/apps
        cp gui/images/azure2_icon.png $CRAFTCTL_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/azure2.png
      fi
      
      # Copy documentation
      mkdir -p $CRAFTCTL_PART_INSTALL/usr/share/doc/azure2
      if [ -f README.md ]; then
        cp README.md $CRAFTCTL_PART_INSTALL/usr/share/doc/azure2/
      fi
      if [ -f LICENSE ]; then
        cp LICENSE $CRAFTCTL_PART_INSTALL/usr/share/doc/azure2/
      fi
      if [ -f CLAUDE.md ]; then
        cp CLAUDE.md $CRAFTCTL_PART_INSTALL/usr/share/doc/azure2/
      fi
      
      # Create man page if not exists
      mkdir -p $CRAFTCTL_PART_INSTALL/usr/share/man/man1
      cat > $CRAFTCTL_PART_INSTALL/usr/share/man/man1/azure2.1 << EOF
      .TH AZURE2 1 "$(date +'%B %Y')" "AZURE2 1.1.0" "User Commands"
      .SH NAME
      azure2 \- R-Matrix Analysis Software
      .SH SYNOPSIS
      .B azure2
      [\fIOPTION\fR]... [\fIFILE\fR]...
      .SH DESCRIPTION
      AZURE2 is a nuclear physics R-Matrix analysis software package used for 
      analyzing nuclear reaction data. It provides both command-line and 
      graphical interfaces for nuclear physics calculations and data fitting.
      .SH OPTIONS
      .TP
      \fB\-\-help\fR
      display this help and exit
      .TP
      \fB\-\-version\fR
      output version information and exit
      .SH AUTHOR
      University of Notre Dame
      .SH "SEE ALSO"
      Documentation available at: https://azure.nd.edu/
      EOF
      
      # Ensure binaries are executable
      chmod +x $CRAFTCTL_PART_INSTALL/usr/bin/AZURE2

  # Add additional Qt plugins and themes for better desktop integration
  qt-integration:
    plugin: nil
    stage-packages:
      - qt5-image-formats-plugins
      - libqt5sql5-sqlite
      - adwaita-qt
    override-stage: |
      craftctl default
      # Ensure Qt plugins are in the right location
      if [ -d usr/lib/*/qt5/plugins ]; then
        find usr/lib/*/qt5/plugins -name "*.so" -exec chmod +x {} \;
      fi